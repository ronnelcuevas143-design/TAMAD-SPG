}

// BINANCE FETCH
// ═══════════════════════════════════════════
async function klines(symbol,tf,limit=50){
  const iv=TF_MAP[tf];
  const urls=[
    `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${iv}&limit=${limit}`,
    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${iv}&limit=${limit}`,
  ];
  for(const url of urls){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),6000);
      const r=await fetch(url,{signal:ctrl.signal});
      clearTimeout(t);
      if(!r.ok)continue;
      const d=await r.json();
      if(!Array.isArray(d)||d.length<4)continue;
      return d.map(k=>({open:+k[1],high:+k[2],low:+k[3],close:+k[4],time:k[0]}));
    }catch{}
  }
  return null;
}

// ═══════════════════════════════════════════
// FVG / OB DETECTORS
// ═══════════════════════════════════════════
function detectFVG(c){
  const z=[];
  for(let i=2;i<c.length;i++){
    const a=c[i-2],b=c[i];
    const d=new Date(b.time).toLocaleDateString("en-PH",{month:"short",day:"numeric"});
    if(b.low>a.high)z.push({type:"bull",src:"FVG",top:b.low,bot:a.high,mid:(b.low+a.high)/2,formed_at:d});
    if(b.high<a.low)z.push({type:"bear",src:"FVG",top:a.low,bot:b.high,mid:(a.low+b.high)/2,formed_at:d});
  }
  return z;
}
function detectOB(c){
  const z=[];
  for(let i=1;i<c.length-1;i++){
    const p=c[i],n=c[i+1];
    const d=new Date(p.time).toLocaleDateString("en-PH",{month:"short",day:"numeric"});
    const up=(n.close-n.open)/n.open>0.004;
    const dn=(n.open-n.close)/n.open>0.004;
    if(p.close<p.open&&up)z.push({type:"bull",src:"OB",top:p.open,bot:p.close,mid:(p.open+p.close)/2,formed_at:d});
    if(p.close>p.open&&dn)z.push({type:"bear",src:"OB",top:p.close,bot:p.open,mid:(p.close+p.open)/2,formed_at:d});
  }
  return z;
}
function inZone(price,z,buf=0.003){
  return price>=z.bot*(1-buf)&&price<=z.top*(1+buf);
}
function hasWick(candle){
  const body=Math.abs(candle.close-candle.open);
  const upper=candle.high-Math.max(candle.close,candle.open);
  const lower=Math.min(candle.close,candle.open)-candle.low;
  return upper>0&&lower>0;
}
function isRGR(c){
  const s=c.slice(-3);
  const [c1,c2,c3]=s;
  return c1.close<c1.open&&c2.close>c2.open&&c3.close<c3.open;
}
function isGRG(c){
  const s=c.slice(-3);
  const [c1,c2,c3]=s;
  return c1.close>c1.open&&c2.close<c2.open&&c3.close>c3.open;
}

const FS={"1W":40,"1D":30,"4H":20};
const LS={"1H":20,"30M":15,"15M":10};
const ZS={"FVG":20,"OB":10};
function fvgScore(h,l,z){return(FS[h]||10)+(LS[l]||5)+(ZS[z]||5);}

async function scanFVGLive(symbol){
  // HTF: collect all zones
  let htfData=null;
  for(const tf of["1W","1D","4H"]){
    const c=await klines(symbol,tf,50);
    if(!c)continue;
    const price=c.at(-1).close;
    const all=[...detectFVG(c),...detectOB(c)];
    if(all.length>0){htfData={tf,zones:all,price};break;}
  }
  if(!htfData)return null;

  // LTF: get pattern + check wick touch on zone
  let ltf=null;
  for(const tf of["1H","30M","15M"]){
    const c=await klines(symbol,tf,20);
    if(!c)continue;
    const last=c.at(-1);
    const rgr=isRGR(c);
    const grg=isGRG(c);
    if(!rgr&&!grg)continue;

    const dir=rgr?"bull":"bear";
    // Check wick touch: bull = lower wick touches zone bot/top, bear = upper wick touches zone top
    const matchedZone=htfData.zones.find(z=>{
      if(z.type!==dir)return false;
      const s=c.slice(-3);
      if(dir==="bull"){
        // Any of 3 candles lower wick touches bull zone
        return s.some(candle=>candle.low<=z.top*(1.003)&&candle.low>=z.bot*(0.997));
      }else{
        // Any of 3 candles upper wick touches bear zone
        return s.some(candle=>candle.high>=z.bot*(0.997)&&candle.high<=z.top*(1.003));
      }
    });
    if(matchedZone){ltf={tf,pattern:rgr?"RGR":"GRG",dir,zone:matchedZone};break;}
  }
  if(!ltf)return null;

  const z=ltf.zone;
  const dir=ltf.dir==="bull"?"BULL":"BEAR";
  return{
    symbol,price:htfData.price,dir,
    htfTF:htfData.tf,zoneType:z.src,zoneDir:z.type,
    zoneTop:z.top,zoneBot:z.bot,zoneMid:z.mid,zoneFormed:z.formed_at,
    ltfTF:ltf.tf,pattern:ltf.pattern,inFVG:z.src==="FVG",
    score:fvgScore(htfData.tf,ltf.tf,z.src),
    tvHTF:tvLink(symbol,htfData.tf),tvLTF:tvLink(symbol,ltf.tf),
  };
}

// ═══════════════════════════════════════════
// SWEEP + OUTSIDE BAR DETECTORS
// ═══════════════════════════════════════════
function detectSweep(c){
  if(c.length<3)return null;
  const prev=c.at(-3),sw=c.at(-2);
  if(sw.low<prev.low&&sw.close>prev.low)return{dir:"bull",sweptLevel:prev.low};
  if(sw.high>prev.high&&sw.close<prev.high)return{dir:"bear",sweptLevel:prev.high};
  return null;
}
function detectOB1m(c){
  // Palaging GREEN outside bar para sa bull at bear
  for(let i=c.length-1;i>=Math.max(1,c.length-5);i--){
    const cur=c[i],prev=c[i-1];
    if(cur.high>prev.high&&cur.low<prev.low&&cur.close>cur.open)return cur;
  }
  return null;
}
async function scanSweepLive(symbol){
  const c15=await klines(symbol,"15M",10);
  if(!c15)return null;
  const sweep=detectSweep(c15);
  if(!sweep)return null;
  const c1=await klines(symbol,"1M",20);
  if(!c1)return null;
  const ob=detectOB1m(c1);
  if(!ob)return null;
  const price=c15.at(-1).close;
  return{
    symbol,price,dir:sweep.dir==="bull"?"BULL":"BEAR",
    sweptLevel:sweep.sweptLevel,
    obHigh:ob.high,obLow:ob.low,obOpen:ob.open,obClose:ob.close,
    obTime:new Date(ob.time).toLocaleTimeString("en-PH",{timeZone:"Asia/Manila",hour12:true,hour:"numeric",minute:"2-digit"}),
    tv15m:tvLink(symbol,"15M"),tv1m:tvLink(symbol,"1M"),
  };
}

// FETCH TOP 50 BY VOLUME (excluding favorites)
// ═══════════════════════════════════════════
async function fetchTop50(){
  const endpoints=[
    "https://fapi.binance.com/fapi/v1/ticker/24hr",
    "https://api.binance.com/api/v3/ticker/24hr",
    "https://corsproxy.io/?https://fapi.binance.com/fapi/v1/ticker/24hr",
  ];
  for(const url of endpoints){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),8000);
      const r=await fetch(url,{signal:ctrl.signal});
      clearTimeout(t);
      if(!r.ok)continue;
      const d=await r.json();
      if(!Array.isArray(d))continue;
      return d
        .filter(x=>x.symbol.endsWith("USDT")&&!WATCHLIST.includes(x.symbol))
        .sort((a,b)=>parseFloat(b.quoteVolume)-parseFloat(a.quoteVolume))
        .slice(0,50)
        .map(x=>x.symbol);
    }catch{}
  }
  return[];
}

function FVGPanel({tgToken,tgChat,bellOn}){
  const [alerts,setAlerts]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [progress,setProgress]=useState(0);
  const [scanned,setScanned]=useState(0);
  const [status,setStatus]=useState(DEMO_MODE?"🟡 DEMO MODE":"");
  const [filter,setFilter]=useState("ALL");
  const [coinSt,setCoinSt]=useState({});
  const [expanded,setExpanded]=useState({});
  const [scanMode,setScanMode]=useState("FAV");
  const [top50List,setTop50List]=useState([]);
  const stopRef=useRef(false);

  const runScan=async()=>{
    if(scanning)return;
    stopRef.current=false;
    setScanning(true);setAlerts([]);setScanned(0);setProgress(0);setCoinSt({});setExpanded({});
    if(DEMO_MODE){
      setStatus("🟡 DEMO — Simulating scan…");
      for(let i=0;i<WATCHLIST.length;i++){
        if(stopRef.current)break;
        const sym=WATCHLIST[i];
        setCoinSt(p=>({...p,[sym]:"scanning"}));
        setScanned(i+1);setProgress(Math.round(((i+1)/WATCHLIST.length)*100));
        await new Promise(r=>setTimeout(r,80));
        setCoinSt(p=>({...p,[sym]:MOCK_FVG.find(a=>a.symbol===sym)?"pass":"fail"}));
      }
      setAlerts(MOCK_FVG);setScanning(false);
      setStatus(`🟡 DEMO — ${MOCK_FVG.length} sample signals`);
      return;
    }
    const found=[];
    let scanList=WATCHLIST;
    if(scanMode==="TOP50"){
      setStatus("Fetching top 50 by volume…");
      const t50=await fetchTop50();
      if(t50.length===0){setScanning(false);setStatus("Failed to fetch top 50. Check connection.");return;}
      setTop50List(t50);
      scanList=t50;
    }
    for(let i=0;i<scanList.length;i++){
      if(stopRef.current)break;
      const sym=scanList[i];
      setStatus(`Scanning ${sym.replace("USDT","")}…`);
      setCoinSt(p=>({...p,[sym]:"scanning"}));
      const r=await Promise.race([
        scanFVGLive(sym),
        new Promise(res=>setTimeout(()=>res(null),5000))
      ]);
      if(r){

function SweepPanel({tgToken,tgChat,bellOn}){
  const [alerts,setAlerts]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [progress,setProgress]=useState(0);
  const [scanned,setScanned]=useState(0);
  const [status,setStatus]=useState(DEMO_MODE?"🟡 DEMO MODE":"");
  const [filter,setFilter]=useState("ALL");
  const [coinSt,setCoinSt]=useState({});
  const stopRef=useRef(false);

  const runScan=async()=>{
    if(scanning)return;
    stopRef.current=false;
    setScanning(true);setAlerts([]);setScanned(0);setProgress(0);setCoinSt({});
    if(DEMO_MODE){
      setStatus("🟡 DEMO — Simulating scan…");
      for(let i=0;i<WATCHLIST.length;i++){
        if(stopRef.current)break;
        const sym=WATCHLIST[i];
        setCoinSt(p=>({...p,[sym]:"scanning"}));
        setScanned(i+1);setProgress(Math.round(((i+1)/WATCHLIST.length)*100));
        await new Promise(r=>setTimeout(r,80));
        setCoinSt(p=>({...p,[sym]:MOCK_SWEEP.find(a=>a.symbol===sym)?"pass":"fail"}));
      }
      setAlerts(MOCK_SWEEP);setScanning(false);
      setStatus(`🟡 DEMO — ${MOCK_SWEEP.length} sample signals`);
      return;
    }
    const found=[];
    for(let i=0;i<WATCHLIST.length;i++){
      if(stopRef.current)break;
      const sym=WATCHLIST[i];
      setStatus(`Checking ${sym.replace("USDT","")}…`);
      setCoinSt(p=>({...p,[sym]:"scanning"}));
      const r=await scanSweepLive(sym);
      if(r){
        found.push(r);setAlerts([...found]);
        setCoinSt(p=>({...p,[sym]:"pass"}));
        if(bellOn&&tgToken&&tgChat)tgSend(tgToken,tgChat,"sweep",r);
        if(bellOn&&"Notification"in window&&Notification.permission==="granted")
          new Notification(`${r.dir==="BULL"?"🟢":"🔴"} ${sym.replace("USDT","")} — SWEEP + OB`,{body:`${r.dir} · swept $${fmt(r.sweptLevel)}`});
      }else{setCoinSt(p=>({...p,[sym]:"fail"}));}
      setScanned(i+1);setProgress(Math.round(((i+1)/WATCHLIST.length)*100));
      await new Promise(r=>setTimeout(r,300));
    }
    setScanning(false);setStatus(`Done — ${found.length} setup${found.length!==1?"s":""} found`);
  };

  const bull=alerts.filter(a=>a.dir==="BULL").length;
  const bear=alerts.filter(a=>a.dir==="BEAR").length;
  const show=filter==="ALL"?alerts:filter==="BULL"?alerts.filter(a=>a.dir==="BULL"):alerts.filter(a=>a.dir==="BEAR");

  return(
    <div>
      {DEMO_MODE&&<div style={{background:"#1a1200",border:"1px solid #5a3a00",borderRadius:7,padding:"8px 12px",marginBottom:10,fontSize:11,color:"#f59e0b",fontFamily:"monospace"}}>
        🟡 DEMO MODE — Peke lang ang data.
      </div>}
      <div style={{background:"#050f1a",border:"1px solid #0d2540",borderRadius:7,padding:"9px 12px",marginBottom:10}}>
        <div style={{fontSize:10,color:"#2a6a8a",letterSpacing:2,marginBottom:5}}>MGA RULES</div>
        <div style={{fontSize:11,color:"#4a8a9a",fontFamily:"monospace",lineHeight:1.8}}>
          <span style={{color:"#22c55e"}}>BULL</span> → 15M wick swept prev LOW → 1M <span style={{color:"#22c55e",fontWeight:700}}>GREEN</span> Outside Bar<br/>
          <span style={{color:"#ef4444"}}>BEAR</span> → 15M wick swept prev HIGH → 1M <span style={{color:"#22c55e",fontWeight:700}}>GREEN</span> Outside Bar<br/>
          <span style={{color:"#1a5a7a",fontSize:10}}>⚠️ Ikaw ang bahala sa entry · Manage your risk</span>
        </div>
      </div>
      <div style={S.controls}>
        <button style={{...S.scanBtn,background:"#004830",opacity:scanning?0.6:1}} onClick={runScan} disabled={scanning}>
          {scanning?<span>⟳ SCANNING…</span>:"▶ SCAN NOW"}
        </button>
        {scanning&&<button style={S.stopBtn} onClick={()=>{stopRef.current=true;}}>■ STOP</button>}
      </div>
      <div style={S.progressWrap}><div style={{...S.progressBar,width:`${progress}%`,background:"#00aa60"}}/></div>
      <div style={S.statsRow}>
        {[{l:"SETUPS",v:alerts.length,c:"#00ff88"},{l:"BULLISH",v:bull,c:"#22c55e"},
          {l:"BEARISH",v:bear,c:"#ef4444"},{l:"SCANNED",v:`${scanned}/${WATCHLIST.length}`,c:"#94a3b8"}].map(s=>(
          <div key={s.l} style={S.stat}>
            <div style={{fontSize:24,fontWeight:700,color:s.c,fontFamily:"monospace"}}>{s.v}</div>
            <div style={{fontSize:9,letterSpacing:1.5,color:"#2a5a7a",marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div style={S.tabs}>
        {["ALL","BULL","BEAR"].map(f=>(
          <button key={f} style={{...S.tab,...(filter===f?S.tabActive:{})}} onClick={()=>setFilter(f)}>{f}</button>
        ))}
      </div>
      {status&&<div style={S.statusLine}>&gt; {status}</div>}
      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
        {show.length===0&&!scanning&&(
          <div style={S.empty}>{alerts.length>0?"Walang match sa filter.":"Press SCAN NOW para magsimula."}</div>
        )}
        {show.map((a,i)=>{
          const b=a.dir==="BULL",sym=a.symbol.replace("USDT","");
          return(
            <div key={i} style={{...S.card,borderColor:b?"#166534":"#7f1d1d",background:b?"#0a1f12":"#1a0a0a",animation:"fadeIn .3s"}}>
              <div style={{...S.cardAccent,background:b?"#22c55e":"#ef4444"}}/>
              <div style={S.cardTop}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{...S.avatar,background:b?"#14532d":"#7f1d1d",fontSize:18}}>{b?"🟢":"🔴"}</div>
                  <div>
                    <div style={{display:"flex",alignItems:"baseline",gap:5,flexWrap:"wrap"}}>
                      <span style={S.coinName}>{sym}</span>
                      <span style={{color:"#4a6a7a",fontSize:12}}>/USDT</span>
                      <span style={{...S.dirBadge,borderColor:b?"#22c55e":"#ef4444",color:b?"#22c55e":"#ef4444"}}>{b?"▲":"▼"} {a.dir}</span>
                    </div>
                    <div style={{color:"#4a8a9a",fontSize:12,fontFamily:"monospace"}}>${fmt(a.price)}</div>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  <a href={a.tv15m} target="_blank" style={S.tvBtn}>📈 15M</a>
                  <a href={a.tv1m}  target="_blank" style={{...S.tvBtn,borderColor:"#1a5a30",color:"#60e090"}}>📊 1M</a>

              </div>

                <div style={{fontSize:10,color:"#2a5a7a",letterSpacing:1.5,marginBottom:4}}>15M SWEEP</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:11,color:"#94a3b8",fontFamily:"monospace"}}>
                    {b?"Low":"High"} swept: <span style={{color:b?"#22c55e":"#ef4444",fontWeight:700}}>${fmt(a.sweptLevel)}</span>
                  </span>
                  <span style={{fontSize:10,color:b?"#22c55e":"#ef4444",border:`1px solid ${b?"#166534":"#7f1d1d"}`,borderRadius:3,padding:"1px 6px"}}>
                    {b?"🔽 Swept Low":"🔼 Swept High"}

              <div style={{background:"#040c14",border:"1px solid #0d2035",borderRadius:7,padding:"8px 10px"}}>

                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <OutsideBarIcon/>
                  <div style={{flex:1,display:"flex",flexDirection:"column",gap:3}}>

                      <div key={l} style={{display:"flex",justifyContent:"space-between"}}>
                        <span style={{fontSize:10,color:"#4a6a7a"}}>{l}</span>
                        <span style={{fontFamily:"monospace",fontSize:11,color:c,fontWeight:700}}>${fmt(v)}</span>

        })}

      <CoinGrid coinSt={coinSt}/>

  );
